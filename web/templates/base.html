<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Geopolítica{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<style>
:root {
  --papel: #f1f2ee;
  --carta: #f8f8f4;
  --tinta: #17202b;
  --prusia: #1f3f66;
  --prusia-oscuro: #16294a;
  --bronce: #a9772c;
  --gris: #5d6672;
  --gris-claro: #79828d;
  --borde: #b9c0c6;
  --filete: #d3d8da;
  --texto: #2b333d;
  --texto-suave: #3d4650;
  --serif: 'Playfair Display', Georgia, serif;
  --lectura: Lora, Georgia, serif;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--papel);
  background-image: repeating-linear-gradient(0deg, rgba(23,32,43,0.03) 0px, rgba(23,32,43,0.03) 1px, transparent 1px, transparent 4px);
  color: var(--tinta); font: 16px/1.6 var(--lectura);
}
a { color: var(--prusia); text-decoration: none; }
a:hover { color: var(--prusia-oscuro); text-decoration: underline; }
mark { background: rgba(169,119,44,0.22); color: inherit; padding: 0 .08em; }
.contenedor { max-width: 1200px; margin: 0 auto; padding: 0 28px 56px; }

/* Masthead */
.fecha-linea { display: flex; justify-content: space-between; padding-top: 22px; font-family: var(--ui); font-size: 12px; color: var(--gris); }
.masthead { text-align: center; padding: 8px 0 12px; border-bottom: 1px solid var(--tinta); }
.masthead a { color: var(--tinta); font-family: var(--serif); font-weight: 900; font-size: clamp(30px, 5vw, 50px); letter-spacing: .1em; }
.masthead a:hover { text-decoration: none; }
.filete-doble { height: 3px; border-top: 1px solid var(--tinta); border-bottom: 1px solid var(--tinta); margin-top: 2px; }

/* Barra de búsqueda/nav */
.barra { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--filete); padding: 10px 4px; flex-wrap: wrap; }
.barra form { display: flex; align-items: center; gap: 10px; flex: 1 1 260px; }
.barra input[type=search] {
  flex: 1; border: none; background: transparent; font: italic 15px var(--lectura);
  color: var(--tinta); outline: none; min-width: 120px;
}
.barra input::placeholder { color: var(--gris-claro); }
.barra select {
  border: 1px solid var(--borde); background: var(--carta); color: var(--gris);
  font-family: var(--ui); font-size: 12.5px; padding: 5px 8px;
}
.barra button {
  border: 1px solid var(--prusia); background: var(--prusia); color: #f3f4f0;
  font-family: var(--ui); font-size: 12.5px; padding: 6px 16px; cursor: pointer;
}
.nav-enlaces { margin-left: auto; display: flex; gap: 18px; font-family: var(--ui); font-size: 12.5px; color: var(--gris); }
.nav-enlaces a { color: var(--gris); }
.nav-enlaces a.activo { color: var(--tinta); border-bottom: 2px solid var(--prusia); padding-bottom: 2px; }
.nav-enlaces a:hover { text-decoration: none; color: var(--tinta); }

/* Piezas editoriales */
.kicker { font-family: var(--ui); font-size: 12px; letter-spacing: .08em; color: var(--prusia); text-transform: uppercase; }
.kicker-bronce { font-family: var(--ui); font-size: 11px; letter-spacing: .08em; color: var(--bronce); text-transform: uppercase; }
.titulo-serif { font-family: var(--serif); font-weight: 700; }
.etiqueta { display: inline-block; border: 1px solid var(--borde); padding: 2px 10px; font-family: var(--ui); font-size: 11.5px; color: var(--gris); }
a.etiqueta:hover { text-decoration: none; border-color: var(--prusia); color: var(--prusia); }
.meta { font-family: var(--ui); font-size: 12.5px; color: var(--gris); }
.caja { background: var(--carta); border: 1px solid var(--borde); }
.num-bronce { font-family: var(--serif); font-weight: 700; color: var(--bronce); }
hr.filete { border: none; border-top: 1px solid var(--tinta); margin: 28px 0 0; }

@media (max-width: 860px) {
  .contenedor { padding: 0 16px 40px; }
  .grid-portada, .grid-tres, .grid-dos { grid-template-columns: 1fr !important; }
  .grid-portada > *, .grid-tres > *, .grid-dos > * { border-left: none !important; padding-left: 0 !important; padding-right: 0 !important; }
  .oculta-movil { display: none; }
}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="contenedor">
  <div class="fecha-linea">
    <span>{{ hoy }}</span>
    <span class="oculta-movil">{{ stats.total }} análisis · {{ stats.issues }} números · {{ stats.desde.year if stats.desde else "" }}–{{ stats.hasta.year if stats.hasta else "" }}</span>
  </div>
  <div class="masthead"><a href="/">GEOPOLÍTICA</a></div>
  <div class="filete-doble"></div>

  <div class="barra">
    <form method="get" action="/">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5d6672" stroke-width="1.8"><circle cx="9" cy="9" r="6"></circle><path d="M13.5 13.5 L18 18"></path></svg>
      <input type="search" name="q" value="{{ q or '' }}" placeholder="Buscar en la hemeroteca…">
      <select name="pub">
        <option value="">Todas las publicaciones</option>
        {% for p in pubs %}<option value="{{ p.slug }}" {% if p.slug == pub %}selected{% endif %}>{{ p.name }}</option>{% endfor %}
      </select>
      <select name="year">
        <option value="0">Todos los años</option>
        {% for y in years %}<option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}</option>{% endfor %}
      </select>
      <button type="submit">Buscar</button>
    </form>
    <nav class="nav-enlaces">
      <a href="/" class="{{ 'activo' if seccion == 'archivo' else '' }}">Archivo</a>
      <a href="/tendencias" class="{{ 'activo' if seccion == 'tendencias' else '' }}">Tendencias</a>
    </nav>
  </div>

  {% block content %}{% endblock %}
</div>
</body>
</html>
