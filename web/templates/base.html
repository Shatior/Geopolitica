<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Geopolítica{% endblock %}</title>
<style>
:root {
  --bg: #faf9f6; --fg: #1c1c1c; --muted: #6b6b6b; --line: #e3e0d8;
  --accent: #8b1d2c; --card: #ffffff; --mark: #f5e2a8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181c; --fg: #e8e6e1; --muted: #9a9890; --line: #2c2f36;
    --accent: #e0687a; --card: #1e2127; --mark: #5c4d1e;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 Georgia, "Times New Roman", serif;
}
header.site {
  border-bottom: 3px double var(--line); padding: 1.2rem 1rem .8rem;
  text-align: center;
}
header.site h1 { margin: 0; font-size: 1.6rem; letter-spacing: .04em; }
header.site h1 a { color: var(--fg); text-decoration: none; }
header.site .sub { color: var(--muted); font-size: .85rem; font-family: system-ui, sans-serif; }
main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
a { color: var(--accent); }
mark { background: var(--mark); color: inherit; padding: 0 .1em; }
.meta { color: var(--muted); font-size: .8rem; font-family: system-ui, sans-serif; }
.tag {
  display: inline-block; border: 1px solid var(--line); border-radius: 999px;
  padding: 0 .6em; margin: 0 .25em .25em 0; font-size: .75rem;
  font-family: system-ui, sans-serif; color: var(--muted); text-decoration: none;
}
form.filters {
  display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem;
  font-family: system-ui, sans-serif;
}
form.filters input[type=search] {
  flex: 1 1 14rem; padding: .5em .8em; border: 1px solid var(--line);
  border-radius: 6px; background: var(--card); color: var(--fg); font-size: .95rem;
}
form.filters select, form.filters button {
  padding: .5em .8em; border: 1px solid var(--line); border-radius: 6px;
  background: var(--card); color: var(--fg); font-size: .9rem;
}
form.filters button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
article.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 1rem 1.2rem; margin-bottom: 1rem;
}
article.card h2 { margin: .1rem 0 .3rem; font-size: 1.15rem; line-height: 1.35; }
article.card h2 a { color: var(--fg); text-decoration: none; }
article.card h2 a:hover { color: var(--accent); }
article.card .snippet { margin: .3rem 0 .5rem; font-size: .92rem; }
nav.pager {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 1.5rem; font-family: system-ui, sans-serif; font-size: .9rem;
}
.article-body { margin-top: 1.5rem; }
.article-body p { margin: 0 0 1em; text-align: justify; hyphens: auto; }
.backlink { font-family: system-ui, sans-serif; font-size: .85rem; }
.warn {
  background: var(--mark); border-radius: 6px; padding: .5em .8em;
  font-family: system-ui, sans-serif; font-size: .85rem;
}
</style>
</head>
<body>
<header class="site">
  <h1><a href="/">Geopolítica</a></h1>
  <div class="sub">Hemeroteca de Política Exterior — uso personal</div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
