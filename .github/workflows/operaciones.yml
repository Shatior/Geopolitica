# Operaciones sobre la hemeroteca, ejecutadas en GitHub y no en el PC.
#
# Se lanza a mano (Actions → operaciones → Run workflow) o desde una sesión de
# Claude Code. Todas las operaciones trabajan contra la base de datos de
# Railway, así que el runner no necesita ficheros locales.
#
# Secretos: DATABASE_URL y PE_COOKIES.

name: operaciones

on:
  workflow_dispatch:
    inputs:
      operacion:
        description: "Qué hacer"
        required: true
        default: diagnostico
        type: choice
        options:
          - diagnostico      # informe de calidad de los datos (no toca nada)
          - mantenimiento    # aplica esquema y clasificaciones (no toca el sitio)
          - inventario       # radiografía del corpus para diseñar análisis
          - lentes           # ejecuta las lentes de análisis (sin coste de IA)
          - muestras         # imprime textos de ejemplo por año, para leerlos
          - probar-pdf       # comprueba si la suscripción da acceso a los PDF
          - enriquecer-estimar   # cuánto costaría enriquecer lo pendiente (gratis)
          - enriquecer-enviar    # CUESTA DINERO: manda un lote a Haiku
          - enriquecer-estado    # cómo va el lote en curso
          - enriquecer-recoger   # guarda los resultados del lote terminado
          - enriquecer-muestra   # enseña lo extraído, para juzgar la calidad
          - scrapear         # busca números nuevos y los carga
          - pdfs             # rescata texto de los PDF de números incompletos
      publicacion:
        description: "Publicación (vacío = todas)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - informe-semanal
          - politica-exterior
      anyos:
        description: "Años para scrapear, p. ej. 2026 o 2024-2026 (vacío = año en curso)"
        required: false
        default: ""
      limite:
        description: "Máximo de artículos/números en esta ejecución (0 = sin límite)"
        required: false
        default: "0"
      reintentar:
        description: "Solo en 'pdfs': reintentar también los números ya probados antes"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: scrape          # nunca dos operaciones a la vez contra el mismo sitio
  cancel-in-progress: false

jobs:
  operar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir cookies de sesión
        if: inputs.operacion == 'scrapear' || inputs.operacion == 'pdfs' || inputs.operacion == 'probar-pdf'
        env:
          PE_COOKIES: ${{ secrets.PE_COOKIES }}
        run: |
          mkdir -p data
          printf '%s\n' "$PE_COOKIES" > data/cookies.txt
          test -s data/cookies.txt || { echo "El secreto PE_COOKIES está vacío"; exit 1; }

      - name: Ejecutar
        env:
          PE_COOKIES_FILE: data/cookies.txt
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Se aceptan varios nombres: el secreto pudo crearse con cualquiera.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY || secrets.ANTHROPIC_KEY }}
          OPERACION: ${{ inputs.operacion }}
          PUBLICACION: ${{ inputs.publicacion }}
          ANYOS: ${{ inputs.anyos }}
          LIMITE: ${{ inputs.limite }}
          REINTENTAR: ${{ inputs.reintentar }}
        run: |
          set -o pipefail
          PUB_ARG=""
          [ -n "$PUBLICACION" ] && PUB_ARG="--publication $PUBLICACION"
          PUB_ARG_LENTE=""
          [ -n "$PUBLICACION" ] && PUB_ARG_LENTE="--publicacion $PUBLICACION"
          LIM_ARG=""
          [ "${LIMITE:-0}" != "0" ] && LIM_ARG="--limit $LIMITE"

          case "$OPERACION" in
            diagnostico)
              python -m db.diag | tee informe.txt
              ;;
            inventario)
              python -m db.inventario | tee informe.txt
              ;;
            lentes)
              python -m agentes.run $PUB_ARG_LENTE | tee informe.txt
              ;;
            enriquecer-*)
              python -m enriquecer.run "${OPERACION#enriquecer-}" \
                $PUB_ARG_LENTE --limite "${LIMITE:-0}" | tee informe.txt
              ;;
            probar-pdf)
              python -m scraper.probar_pdf $PUB_ARG_LENTE \
                --limite "${LIMITE:-3}" | tee informe.txt
              ;;
            muestras)
              python -m db.muestras --publicacion "${PUBLICACION:-informe-semanal}" \
                --anyos "${ANYOS:-2019,2023,2026}" | tee informe.txt
              ;;
            mantenimiento)
              python -m db.migrar | tee informe.txt
              python -m db.diag | tee -a informe.txt
              ;;
            scrapear)
              AN="${ANYOS:-$(date -u +%Y)}"
              python -m scraper.run $PUB_ARG --years "$AN" --skip-from-db $LIM_ARG | tee informe.txt
              python -m db.load | tee -a informe.txt
              python -m db.diag | tee -a informe.txt
              ;;
            pdfs)
              RE_ARG=""
              [ "$REINTENTAR" = "true" ] && RE_ARG="--reintentar"
              python -m scraper.pdfs --from-db $PUB_ARG $LIM_ARG $RE_ARG | tee informe.txt
              python -m db.diag | tee -a informe.txt
              ;;
            *)
              echo "Operación desconocida: $OPERACION"; exit 1 ;;
          esac

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Operación: ${{ inputs.operacion }}"
            echo '```'
            tail -n 60 informe.txt 2>/dev/null || echo "(sin salida)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
